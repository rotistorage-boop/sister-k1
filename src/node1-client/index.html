<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduRPC - Sistem Akademik Terdistribusi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body class="min-h-screen flex bg-zinc-50/80 text-zinc-800 antialiased">

    <!-- Sidebar (Left-aligned, Assertive Typography, Muted Minimalist) -->
    <aside id="app-sidebar" class="w-64 bg-white border-r border-zinc-200/90 flex flex-col justify-between fixed inset-y-0 left-0 z-30">
      <div>
        <!-- Brand / Header -->
        <div class="px-6 py-6 border-b border-zinc-100 flex items-center gap-3.5">
          <div class="w-9 h-9 rounded-lg bg-zinc-900 flex items-center justify-center text-white flex-shrink-0">
            <i data-lucide="layers" class="w-5 h-5"></i>
          </div>
          <div class="text-left">
            <h1 class="text-base font-bold text-zinc-900 leading-tight">EduRPC</h1>
            <p class="text-xs font-medium text-zinc-500">Sistem Terdistribusi</p>
          </div>
        </div>

        <!-- Navigation Menu -->
        <nav class="p-4 space-y-1.5 text-left">
          <div class="px-3 py-2 text-xs font-bold text-zinc-400 uppercase tracking-wider text-left">Navigasi Utama</div>
          
          <button data-tab="dashboard" class="nav-btn w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition-colors text-left">
            <i data-lucide="layout-dashboard" class="w-4 h-4 flex-shrink-0"></i>
            <span class="flex-1 text-left font-medium">Dashboard</span>
          </button>

          <button data-tab="student" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition-colors text-left">
            <div class="flex items-center gap-3">
              <i data-lucide="users" class="w-4 h-4 flex-shrink-0"></i>
              <span class="text-left font-medium">Mahasiswa</span>
            </div>
            <span class="bg-zinc-100 text-zinc-600 text-xs font-mono px-2 py-0.5 rounded font-medium border border-zinc-200/60">N2</span>
          </button>

          <button data-tab="course" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition-colors text-left">
            <div class="flex items-center gap-3">
              <i data-lucide="book-open" class="w-4 h-4 flex-shrink-0"></i>
              <span class="text-left font-medium">Mata Kuliah</span>
            </div>
            <span class="bg-zinc-100 text-zinc-600 text-xs font-mono px-2 py-0.5 rounded font-medium border border-zinc-200/60">N3</span>
          </button>

          <button data-tab="krs" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition-colors text-left">
            <div class="flex items-center gap-3">
              <i data-lucide="file-check" class="w-4 h-4 flex-shrink-0"></i>
              <span class="text-left font-medium">KRS (Studi)</span>
            </div>
            <span class="bg-zinc-100 text-zinc-600 text-xs font-mono px-2 py-0.5 rounded font-medium border border-zinc-200/60">N4</span>
          </button>

          <button data-tab="schedule" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition-colors text-left">
            <div class="flex items-center gap-3">
              <i data-lucide="calendar" class="w-4 h-4 flex-shrink-0"></i>
              <span class="text-left font-medium">Jadwal Kuliah</span>
            </div>
            <span class="bg-zinc-100 text-zinc-600 text-xs font-mono px-2 py-0.5 rounded font-medium border border-zinc-200/60">N5</span>
          </button>

          <div class="px-3 pt-3 pb-1 text-xs font-bold text-zinc-400 uppercase tracking-wider text-left">Sinkronisasi</div>

          <button data-tab="timesync" class="nav-btn w-full flex items-center justify-between px-3.5 py-2.5 rounded-lg text-sm font-medium text-zinc-600 hover:bg-zinc-100 hover:text-zinc-900 transition-colors text-left">
            <div class="flex items-center gap-3">
              <i data-lucide="clock" class="w-4 h-4 flex-shrink-0"></i>
              <span class="text-left font-medium">Waktu KRS</span>
            </div>
            <span class="bg-zinc-100 text-zinc-600 text-xs font-mono px-2 py-0.5 rounded font-medium border border-zinc-200/60">N1-N4</span>
          </button>
        </nav>
      </div>

      <!-- Sidebar Footer -->
      <div class="p-4 border-t border-zinc-100 text-left">
        <div class="bg-zinc-50 border border-zinc-200 rounded-lg p-3 text-left">
          <div class="flex items-center gap-2 mb-1">
            <span class="w-2 h-2 rounded-full bg-zinc-700"></span>
            <span class="text-xs font-semibold text-zinc-800">Node Architecture</span>
          </div>
          <p class="text-xs text-zinc-500 leading-snug">Sistem Terdistribusi | Monorepo</p>
        </div>
      </div>
    </aside>

    <!-- Main Content Area -->
    <div class="ml-64 flex-1 flex flex-col min-h-screen">
      <!-- Top Bar -->
      <header class="bg-white border-b border-zinc-200/90 px-8 py-5 flex items-center justify-between sticky top-0 z-20">
        <div class="text-left">
          <h2 id="page-title" class="text-lg font-bold text-zinc-900 tracking-tight">Dashboard</h2>
          <p id="page-desc" class="text-xs font-medium text-zinc-500 mt-0.5">Sistem Akademik Terdistribusi</p>
        </div>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-2 bg-zinc-100 border border-zinc-200 text-zinc-800 text-xs font-semibold px-3 py-1.5 rounded-lg">
            <i data-lucide="terminal" class="w-3.5 h-3.5 text-zinc-600"></i>
            <span>Node 1 | Web Client</span>
          </div>
        </div>
      </header>

      <!-- Page Dynamic View -->
      <main id="current-view" class="flex-1 p-8 max-w-7xl w-full mx-auto"></main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
